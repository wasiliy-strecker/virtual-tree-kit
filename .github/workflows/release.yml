name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    name: Verify and publish package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify workspace and package
        run: pnpm verify
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify browser behavior
        run: pnpm test:e2e
      - name: Pack release artifact
        run: |
          mkdir -p release-artifacts
          pnpm --dir packages/virtual-tree-kit pack \
            --pack-destination ../../release-artifacts
          cd release-artifacts
          sha256sum ./*.tgz > virtual-tree-kit-${GITHUB_REF_NAME#v}.tgz.sha256
      - name: Attest package provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-artifacts/virtual-tree-kit-*.tgz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-artifacts/* \
            --generate-notes \
            --title "Virtual Tree Kit $GITHUB_REF_NAME" \
            --verify-tag
